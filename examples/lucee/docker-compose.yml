services:

  pssdk-example-lucee:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        PSJOA_JAR_VERSION: 8.62.07
    env_file: .env
    environment:
      # JVM-level system properties — read by the JVM itself, no CATALINA_OPTS needed.
      JAVA_TOOL_OPTIONS: "-DTM_ALLOW_NOTLS=Y -Dlogback.statusListenerClass=ch.qos.logback.core.status.OnConsoleStatusListener"
      # OS env var fallback — newer PSJOA builds (8.62+) check getenv() not getProperty().
      TM_ALLOW_NOTLS: "Y"
      ENVIRONMENT: docker-compose
      # App Server connection comes from .env — see .env.sample. Never commit real values here.
      PS_APPSERVER_HOSTPORT:
      PS_APPSERVER_DOMAINPW:
      PS_APPSERVER_USERNAME:
      PS_APPSERVER_PASSWORD:
      PSJOA_JAR_VERSION: 8.62.07
    ports:
      - 8888:8888
